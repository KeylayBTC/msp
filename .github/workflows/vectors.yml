name: vectors

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install embit (for the address checks)
        run: pip install embit
      - name: Verify test vectors
        run: python3 tools/verify-vectors.py
